name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-otp-27-rebar3-3.24.0-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-27-rebar3-3.24.0-

      - name: Compile
        run: rebar3 compile

      - name: Check formatting
        run: rebar3 fmt --check

  sca:
    name: SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download SAFE binary
        # rebar3 plugins cannot add themselves as their own plugin (unlike Mix
        # tasks), so we download the SAFE binary directly and invoke it here.
        run: |
          MANIFEST=$(curl -sf https://safe-releases.s3.eu-central-1.amazonaws.com/versions.json)
          SAFE_VERSION=$(echo "$MANIFEST" | jq -r '[keys[] | select(test("^1\\.5\\.[0-9]+$"))] | sort | last')
          curl -sL "https://safe-releases.s3.eu-central-1.amazonaws.com/${SAFE_VERSION}/safe-${SAFE_VERSION}-linux-x86_64.tar.gz" | tar xz
          chmod +x safe

      - name: Run SCA
        run: ./safe sca --warnings-as-errors

  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-otp-27-rebar3-3.24.0-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-27-rebar3-3.24.0-

      - name: Compile
        run: rebar3 compile

      - name: Download SAFE binary
        # rebar3 plugins cannot add themselves as their own plugin (unlike Mix
        # tasks), so we download the SAFE binary directly and invoke it here.
        run: |
          MANIFEST=$(curl -sf https://safe-releases.s3.eu-central-1.amazonaws.com/versions.json)
          SAFE_VERSION=$(echo "$MANIFEST" | jq -r '[keys[] | select(test("^1\\.5\\.[0-9]+$"))] | sort | last')
          curl -sL "https://safe-releases.s3.eu-central-1.amazonaws.com/${SAFE_VERSION}/safe-${SAFE_VERSION}-linux-x86_64.tar.gz" | tar xz
          chmod +x safe

      - name: Analyse
        run: ./safe analyse --config-path .safe/config.json --project-root .
        env:
          SAFE_LICENSE: ${{ secrets.SAFE_LICENSE }}

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-otp-27-rebar3-3.24.0-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-27-rebar3-3.24.0-

      - name: Compile
        run: rebar3 compile

      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: _build/default/*_plt*
          key: ${{ runner.os }}-otp-27-plt-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-27-plt-

      - name: Run Dialyzer
        run: rebar3 dialyzer

  test:
    name: OTP ${{ matrix.otp }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        otp: ['25', '26', '27', '28']
        os: [ubuntu-latest, macos-latest]
        include:
          # arm64 Linux — aarch64
          - os: ubuntu-24.04-arm
            otp: '27'

    steps:
      - uses: actions/checkout@v4

      - name: Fix ImageOS for arm64
        if: matrix.os == 'ubuntu-24.04-arm'
        run: echo "ImageOS=ubuntu24" >> $GITHUB_ENV

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-rebar3-3.24.0-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp }}-rebar3-3.24.0-

      - name: Compile
        run: rebar3 compile

      - name: Run tests with coverage
        run: rebar3 eunit --cover

      - name: Enforce coverage
        run: rebar3 cover --min_coverage=40

  integration-test:
    name: Integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-otp-27-rebar3-3.24.0-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-27-rebar3-3.24.0-

      - name: Run integration tests
        run: python3 scripts/integration_test.py -v
